# Merge gate (POC)
# Evaluates the record and posts CHANGED / NOTHING NEW / UNDETERMINABLE.
# Fires when garnet-runtime-review[bot] posts a Runtime Review, or when
# someone comments /merge-gate on a PR. Manual re-runs via workflow_dispatch.
# Proof of concept only. Garnet reports; the reviewer decides.
name: Merge gate

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to gate"
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && (
        github.event.comment.user.login == 'garnet-runtime-review[bot]' ||
        contains(github.event.comment.body, '/merge-gate')
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/merge-gate
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run merge gate
        run: python3 .github/merge-gate/gate.py "$REPOSITORY" "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.issue.number }}
